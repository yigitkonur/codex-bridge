name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: bundle + sanity-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: build skill bundle
        run: npm run build

      - name: test
        run: npm test
        timeout-minutes: 2

      - name: verify committed bundle matches fresh build
        run: |
          # Both the skill/ bundle (legacy install via npx skills add) and the
          # plugin/ bundle (canonical v2.0+ install) ship as committed artifacts —
          # no build step runs on the end-user's machine. Any diff here means a
          # contributor forgot to run `npm run build` before committing.
          if ! git diff --quiet --exit-code -- skill/scripts skill/app-server-broker.mjs skill/prompts skill/schemas skill/templates \
                                               plugin/scripts plugin/prompts plugin/schemas plugin/templates; then
            echo "::error::committed bundle is stale. run 'npm run build' and commit the changes."
            git --no-pager diff --stat -- skill/scripts skill/app-server-broker.mjs skill/prompts skill/schemas skill/templates \
                                          plugin/scripts plugin/prompts plugin/schemas plugin/templates
            exit 1
          fi

      - name: verify bundle outputs exist
        run: |
          for f in \
            skill/scripts/codex-bridge.mjs \
            skill/app-server-broker.mjs \
            skill/prompts/adversarial-review.md \
            skill/schemas/review-output.schema.json \
            skill/templates/execute-instructions.md \
            skill/templates/plan-enforcement.md \
            plugin/scripts/codex-bridge.mjs \
            plugin/scripts/app-server-broker.mjs \
            plugin/prompts/adversarial-review.md \
            plugin/schemas/review-output.schema.json \
            plugin/templates/execute-instructions.md \
            plugin/templates/plan-enforcement.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done

      # Sanity probes run against BOTH bundle layouts so a future divergence
      # between skill/ and plugin/ entry points is caught at build time. Today
      # the two bundles are byte-identical, but the dual-output build introduced
      # in T8 means either bundle is a real shipping artifact and either could
      # regress independently.

      - name: sanity — help --json parses
        run: |
          for bundle in skill/scripts/codex-bridge.mjs plugin/scripts/codex-bridge.mjs; do
            echo "::group::help --json ($bundle)"
            node "$bundle" help --json > /tmp/help.json
            node -e "const j = require('/tmp/help.json'); if (!j.ok || !Array.isArray(j.result.commands) || j.result.commands.length < 10) { console.error('help envelope failed sanity for $bundle'); process.exit(1); }"
            echo "::endgroup::"
          done

      - name: sanity — version --json parses
        run: |
          # `version` spawns the codex binary to query its version; codex isn't
          # installed on CI, so accept either a valid envelope or a non-zero
          # exit with a known error code (auth/dependency_failed).
          for bundle in skill/scripts/codex-bridge.mjs plugin/scripts/codex-bridge.mjs; do
            echo "::group::version --json ($bundle)"
            set +e
            OUT=$(node "$bundle" version --json 2>&1)
            STATUS=$?
            set -e
            echo "$OUT"
            if [ $STATUS -eq 0 ]; then
              node -e "const j = $OUT; if (!j.ok || j.result.schema_version !== '1.0') process.exit(1);"
            else
              # CI without codex installed → exit 7 is acceptable
              if [ $STATUS -ne 7 ] && [ $STATUS -ne 3 ] && [ $STATUS -ne 4 ]; then
                echo "unexpected exit status $STATUS for $bundle"; exit 1
              fi
            fi
            echo "::endgroup::"
          done

      - name: sanity — unknown subcommand returns envelope
        run: |
          for bundle in skill/scripts/codex-bridge.mjs plugin/scripts/codex-bridge.mjs; do
            echo "::group::unknown subcommand ($bundle)"
            set +e
            OUT=$(node "$bundle" does-not-exist --json 2>&1)
            STATUS=$?
            set -e
            test "$STATUS" = 2 || { echo "expected exit 2 for $bundle, got $STATUS"; exit 1; }
            node -e "const j = $OUT; if (j.ok !== false || j.error.code !== 'UNKNOWN_SUBCOMMAND') { console.error(j); process.exit(1); }"
            echo "::endgroup::"
          done

      - name: sanity — invalid thread-id rejected
        run: |
          for bundle in skill/scripts/codex-bridge.mjs plugin/scripts/codex-bridge.mjs; do
            echo "::group::invalid thread-id ($bundle)"
            set +e
            OUT=$(node "$bundle" send thr_abc 'hi' --json 2>&1)
            STATUS=$?
            set -e
            test "$STATUS" = 6 || { echo "expected exit 6 for $bundle, got $STATUS"; exit 1; }
            node -e "const j = $OUT; if (j.error.code !== 'INVALID_THREAD_ID') { console.error(j); process.exit(1); }"
            echo "::endgroup::"
          done
