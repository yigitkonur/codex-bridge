name: version-bump

# Auto-bump the package version on every merge to main.
#
# Rule (codified in scripts/bump-version.mjs):
#   - Default: patch+1   (2.2.0 → 2.2.1)
#   - Patch caps at 9: roll over to minor+1, patch=0   (2.4.9 → 2.5.0)
#
# After bumping the 5 version-bearing files, the workflow commits + creates a
# `vX.Y.Z` tag + pushes both. The tag push is what fans into release.yml to
# package and attach the release artifacts.
#
# Race handling: when N PRs merge within seconds, GitHub Actions queues N
# workflow runs. Each must produce a DISTINCT patch increment (one per merge).
# The bump+push step is wrapped in a fetch-rebase-retry loop: on push failure
# we re-fetch origin/main, re-read the now-current version, recompute the
# next, and retry. This converts a "non-fast-forward" race into "next bump on
# top of whatever just landed."
#
# Cascade caveat: GitHub does NOT trigger downstream workflows for tags pushed
# with the default GITHUB_TOKEN. To get the release pipeline to fire
# automatically on each bump, set repo secret RELEASE_PAT to a personal access
# token with `repo` + `workflow` scopes; we fall back to GITHUB_TOKEN when
# RELEASE_PAT is missing (tag still lands, but release.yml must be triggered
# manually with `gh workflow run release.yml -f tag=vX.Y.Z`).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  # Serialize bumps so two near-simultaneous merges produce two distinct
  # patch versions instead of racing on the same one. The retry loop below is
  # belt-and-braces — it covers the window where Actions has scheduled two
  # runs before the first finishes pushing.
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Skip the bot's own bump commits and explicit "[skip ci]" / chore(release)
    # commits so we don't loop.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')
      && !startsWith(github.event.head_commit.message, 'chore(release):')
      && github.event.head_commit.author.username != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the release PAT if available so the tag push triggers
          # release.yml; fall back to GITHUB_TOKEN (commit lands, release
          # pipeline must be triggered manually for that bump).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install dependencies
        # bump-version.mjs runs `npm run build` to regenerate the version-
        # stamped bundles; that needs node_modules.
        run: npm ci

      - name: configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: bump, commit, tag, push (with rebase-on-race retry)
        id: bump
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=8
          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            echo "::group::attempt $attempt"

            # Reset to a clean tip-of-main and recompute the bump from the
            # NOW-CURRENT version, not the version that was current when the
            # workflow was scheduled. Crucial when multiple workflows race.
            git fetch origin main --tags --quiet
            git reset --hard origin/main

            node scripts/bump-version.mjs

            # capture previous/next from the script's GITHUB_OUTPUT writes —
            # they're appended each iteration, so read the LAST occurrence.
            PREVIOUS=$(grep '^previous=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            NEXT=$(grep '^next=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
            echo "computed: $PREVIOUS → $NEXT"

            # If the tag we want to create already exists upstream, the prior
            # workflow run beat us to this slot — fetch and retry to land on
            # the next slot.
            if git ls-remote --tags --exit-code origin "v${NEXT}" >/dev/null 2>&1; then
              echo "v${NEXT} already exists upstream — racing, retrying"
              attempt=$((attempt + 1))
              # Drop any partial work; next iter resets to fresh main.
              git restore --staged --worktree -- . 2>/dev/null || true
              echo "::endgroup::"
              sleep 2
              continue
            fi

            # Stage version-bearing files PLUS the regenerated bundles
            # (bump-version.mjs runs `npm run build` after stamping the
            # version, so the bundles' embedded `version: "<n>"` field
            # matches the new package.json). Without staging the bundles,
            # main drifts one version behind every patch bump and every PR
            # CI fails the bundle-match check.
            git add \
              package.json \
              .claude-plugin/plugin.json \
              plugin/.claude-plugin/plugin.json \
              skill/SKILL.md \
              plugin/skills/codex-bridge/SKILL.md \
              skill/scripts/codex-bridge.mjs \
              plugin/scripts/codex-bridge.mjs
            git commit -m "chore(release): bump v${PREVIOUS} → v${NEXT} [skip ci]"
            git tag "v${NEXT}"

            if git push origin HEAD:main && git push origin "v${NEXT}"; then
              echo "::endgroup::"
              {
                echo "previous=${PREVIOUS}"
                echo "next=${NEXT}"
              } >> "$GITHUB_OUTPUT"
              echo "::notice::version bumped: v${PREVIOUS} → v${NEXT}"
              exit 0
            fi

            echo "push failed (race) — discarding local commit and retrying"
            git tag -d "v${NEXT}" 2>/dev/null || true
            git reset --hard "origin/main"
            echo "::endgroup::"
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "::error::version-bump failed after $MAX_ATTEMPTS attempts; manual intervention required"
          exit 1

      - name: summary
        if: always() && steps.bump.outputs.next != ''
        run: |
          {
            echo "### Version bumped"
            echo ""
            echo "\`v${{ steps.bump.outputs.previous }}\` → \`v${{ steps.bump.outputs.next }}\`"
            echo ""
            if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
              echo "ℹ️ \`RELEASE_PAT\` secret not set — tag pushed but \`release.yml\` will not auto-fire. Run \`gh workflow run release.yml --ref v${{ steps.bump.outputs.next }}\` to package the release."
            else
              echo "Release pipeline triggered via tag push."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
