name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  bundle:
    name: build + attach skill tarball to release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      - name: static verification
        run: npm run verify:static

      - name: package release payload
        run: npm run release:package -- --tag "$GITHUB_REF_NAME" --skip-build

      - name: expose release notes path
        id: notes
        run: echo "notes_path=dist/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codex-bridge-*.tar.gz
            dist/codex-bridge-*.zip
            dist/SHA256SUMS
          body_path: ${{ steps.notes.outputs.notes_path }}
          # generate_release_notes appends the commit-based auto-summary
          # AFTER the body. Useful both when the CHANGELOG section exists
          # (readers see "release notes + commit trail") and when it
          # doesn't (fallback commit list).
          generate_release_notes: true
          fail_on_unmatched_files: true
